[package]
name = "audio-transcriber"
version = "0.1.0"
description = "Audio recording and transcription app"
authors = ["Audio Transcriber"]
edition = "2021"
rust-version = "1.70.0"
publish = false

[lib]
name = "audio_transcriber_lib"
path = "src/lib.rs"

[[bin]]
name = "audio-transcriber"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
notify = "6.1"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[profile.release]
strip = true
opt-level = "z"
lto = true
